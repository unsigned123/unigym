[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unigym"
version = "0.106.0"
description = "Multi-backend robot simulation and evaluation framework"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "UniGym contributors"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "mujoco==4.0.0",
    "torch>=2.4,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/unsigned123/unigym"
Repository = "https://github.com/unsigned123/unigym"
Issues = "https://github.com/unsigned123/unigym/issues"

[project.optional-dependencies]
daemon = [
    "pyzmq>=24.0,<28.0",
    "requests>=2.28,<3.0",
]
webui = [
    "unigym[daemon]",
]
record = [
    "pillow>=10.0,<13.0",
    "imageio[ffmpeg]>=2.28,<3.0",
]
media = [
    "av>=14.0,<18.0",
    "aiortc>=1.9,<2.0",
]
usd = [
    "usd-core>=24.0,<27.0",
]
warp = [
    "mujoco==4.0.0",
    "mujoco-warp==4.0.0",
    "warp-lang>=1.15,<2",
]
dev = [
    "pytest>=8.0,<10.0",
    "ruff==0.8.6",
    "import-linter==2.15",
    "pyright[nodejs]==1.1.414",
    "mujoco-stubs==4.0.0.1",
    "pre-commit==3.8.0",
]

[project.scripts]
unigym = "unigym.scripts.launch:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------------------
# Import-linter contracts.  The public core ships ONE adapter (manual), so the
# historical per-adapter independence contract is reduced to the manual face.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["unigym"]

[[tool.importlinter.contracts]]
name = "Adapter subtrees stay independent"
type = "independence"
modules = ["unigym.adapters.manual"]

[[tool.importlinter.contracts]]
name = "unigym.core imports nothing above itself (stdlib + third-party only)"
type = "forbidden"
source_modules = ["unigym.core"]
forbidden_modules = ["unigym.*"]
ignore_imports = [
    "unigym.core.** -> unigym.runtime.**",
    "unigym.core.** -> unigym.backends.**",
    "unigym.core.** -> unigym.adapters",
    "unigym.core.** -> unigym.scripts.**",
    "unigym.core.asset_root -> unigym.packs.refs",
    "unigym.core.asset_root -> unigym.errors",
]

[[tool.importlinter.contracts]]
name = "task providers import nothing above themselves (pure spec-builders)"
type = "forbidden"
source_modules = ["unigym.benchmarks.task_providers"]
forbidden_modules = ["unigym.*"]

[[tool.importlinter.contracts]]
name = "props neutral zone never imports backends (design §12.2)"
type = "forbidden"
source_modules = ["unigym.props"]
forbidden_modules = ["unigym.backends.**"]
ignore_imports = [
    "unigym.props.base -> unigym.backends.registry",
    "unigym.props.base -> unigym.core.quat",
    "unigym.props.asset_ir.definition -> unigym.model",
]

[[tool.importlinter.contracts]]
name = "scenes vocabulary never imports backends (design §3/§4)"
type = "forbidden"
source_modules = ["unigym.scenes"]
forbidden_modules = ["unigym.backends.**"]

[[tool.importlinter.contracts]]
name = "neutral layers never import backends"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "unigym.model",
    "unigym.run",
    "unigym.cameras",
    "unigym.contacts",
    "unigym.director",
]
forbidden_modules = ["unigym.backends.**"]
ignore_imports = [
    "unigym.model.ir -> unigym.backends.registry",
    "unigym.model.live -> unigym.backends.registry",
    "unigym.cameras.capabilities -> unigym.backends.registry",
    "unigym.cameras.manager -> unigym.backends.registry",
    "unigym.cameras.rigs -> unigym.backends.registry",
    "unigym.director.ops -> unigym.backends.registry",
    "unigym.run.build -> unigym.backends.registry",
    "unigym.run.spec -> unigym.backends.registry",
    "unigym.run.api -> unigym.backends.registry",
    "unigym.contacts.base -> unigym.backends.registry",
]

[[tool.importlinter.contracts]]
name = "isaaclab backends stay out of the MuJoCo family"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["unigym.backends.isaaclab2", "unigym.backends.isaaclab3"]
forbidden_modules = [
    "unigym.backends.mujoco",
    "unigym.backends.mujoco.**",
    "unigym.backends.mjwarp",
    "unigym.backends.mjwarp.**",
    "unigym.backends.shared.mjfamily",
    "unigym.backends.shared.mjfamily.**",
]

[[tool.importlinter.contracts]]
name = "mujoco family never imports an isaaclab backend"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["unigym.backends.mujoco", "unigym.backends.mjwarp"]
forbidden_modules = [
    "unigym.backends.isaaclab2",
    "unigym.backends.isaaclab2.**",
    "unigym.backends.isaaclab3",
    "unigym.backends.isaaclab3.**",
]

[[tool.importlinter.contracts]]
name = "shared.mjfamily is private to mujoco/mjwarp"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "unigym.core",
    "unigym.model",
    "unigym.run",
    "unigym.props",
    "unigym.cameras",
    "unigym.contacts",
    "unigym.director",
    "unigym.scenes",
    "unigym.adapters",
    "unigym.backends.isaaclab2",
    "unigym.backends.isaaclab3",
]
forbidden_modules = [
    "unigym.backends.shared.mjfamily",
    "unigym.backends.shared.mjfamily.**",
]

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["unigym*"]

# The portal face is package data, not Python: the HTML pages + assets ship
# inside the distribution and resolve through importlib.resources.
[tool.setuptools.package-data]
"unigym" = ["py.typed"]
"unigym.webui" = ["*.html", "assets/*"]
"unigym.props" = ["*.urdf"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["data_out", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "D"]
extend-ignore = [
    "E402",
    "E203",
    "E116",
    "D105",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# tests/ docstring rules stay out of scope.
"tests/**" = ["D1", "D2", "D3", "D4"]
"unigym/__init__.py" = ["D205", "D209", "D415"]
