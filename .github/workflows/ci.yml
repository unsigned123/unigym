name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYRIGHT_PYTHON_GLOBAL_NODE: "false"
  MUJOCO_GL: egl
  UV_LINK_MODE: copy

jobs:
  precommit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install dev environment
        run: uv sync --frozen --extra dev
      - name: Run pre-commit
        run: .venv/bin/pre-commit run --all-files

  types:
    name: pyright gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install dev environment
        run: uv sync --frozen --extra dev
      - name: Hard gates and ratchets
        run: |
          .venv/bin/python tools/ci/check_pyright.py \
            --hard pyrightconfig.api.json pyrightconfig.model.json pyrightconfig.scene.json

  types-main-report:
    name: pyright main report (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install dev environment
        run: uv sync --frozen --extra dev
      - name: Report main config
        run: .venv/bin/pyright -p pyrightconfig.json

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install headless GL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libosmesa6-dev libgl1
      - name: Install dev environment
        run: uv sync --frozen --extra dev
      - name: Run d0 lane
        run: .venv/bin/python tools/ci/run_lane.py --lane d0

      - name: Generate test catalog
        run: .venv/bin/python tools/ci/test_catalog.py --out /tmp/test-catalog.json

      - name: Upload test catalog
        uses: actions/upload-artifact@v4
        with:
          name: test-catalog
          path: /tmp/test-catalog.json

  integration:
    name: integration lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install dev environment
        run: uv sync --frozen --extra dev
      - name: Run integration lane
        run: .venv/bin/python tools/ci/run_lane.py --lane integration

  imports:
    name: import contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install dev environment
        run: uv sync --frozen --extra dev
      - name: Run import-linter
        run: .venv/bin/lint-imports --no-cache

  package:
    name: package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel
        run: uv build
      - name: Install wheel in a clean environment
        run: |
          uv venv --python 3.11 /tmp/unigym-wheel-test
          uv pip install --python /tmp/unigym-wheel-test/bin/python dist/*.whl "pytest>=8.0,<10.0"
      - name: Copy smoke tests outside the checkout
        run: |
          rm -rf /tmp/unigym-wheel-tests
          mkdir -p /tmp/unigym-wheel-tests
          cp -R tests/smoke /tmp/unigym-wheel-tests/smoke
      - name: Run wheel smoke tests outside the checkout
        run: |
          cd /tmp/unigym-wheel-tests
          env -u PYTHONPATH /tmp/unigym-wheel-test/bin/python -m pytest smoke -q
