name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MUJOCO_GL: egl
  UV_LINK_MODE: copy

jobs:
  d0-py312:
    name: d0 lane (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install headless GL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libosmesa6-dev libgl1
      - name: Install dev environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Run d0-py312 lane
        run: .venv/bin/python tools/ci/run_lane.py --lane d0-py312

  mujoco-py312:
    name: mujoco lane (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install headless GL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libosmesa6-dev libgl1
      - name: Install dev environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Run mujoco-py312 lane
        run: .venv/bin/python tools/ci/run_lane.py --lane mujoco-py312

  c1:
    name: c1 lane (Python 3.11 / MuJoCo 3.1.1 / NumPy 1.26.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install headless GL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libosmesa6-dev libgl1
      - name: Provision clean C1 environment
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python -e . --no-deps
          uv pip install --python .venv/bin/python \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          uv pip install --python .venv/bin/python \
            'PyYAML>=6.0,<7.0' 'pytest>=8.0,<10.0' \
            mujoco==3.1.1 numpy==1.26.4
      - name: Run C1 lanes
        run: |
          .venv/bin/python tools/ci/run_lane.py --lane d0-c1
          .venv/bin/python tools/ci/run_lane.py --lane mujoco-c1

  mjwarp:
    name: mjwarp lane (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install headless GL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libosmesa6-dev libgl1
      - name: Install dev + warp environment
        run: uv sync --frozen --extra dev --extra warp
      - name: Run mjwarp lane
        run: .venv/bin/python tools/ci/run_lane.py --lane mjwarp

  isaaclab2:
    name: backend isaaclab2 (self-hosted)
    if: ${{ vars.UNIGYM_RUN_ISAACLAB2 == 'true' }}
    runs-on: [self-hosted, isaaclab2]
    timeout-minutes: 60
    env:
      UNIGYM_ISAACLAB2_ENV: ${{ vars.UNIGYM_ISAACLAB2_ENV }}
      UNIGYM_TEST_PACKS_WHEELHOUSE: ${{ vars.UNIGYM_TEST_PACKS_WHEELHOUSE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test packs
        run: |
          test -n "$UNIGYM_TEST_PACKS_WHEELHOUSE"
          CONDA="${UNIGYM_CONDA_EXE:-conda}"
          "$CONDA" run --no-capture-output -n "$UNIGYM_ISAACLAB2_ENV" \
            python -m pip install --no-deps \
            "$UNIGYM_TEST_PACKS_WHEELHOUSE"/unigym_test_packs-*.whl \
            "$UNIGYM_TEST_PACKS_WHEELHOUSE"/unigym_test_pack_isaaclab_cartpole-*.whl
      - name: Run isaaclab2 lane
        run: python3 tools/ci/run_lane.py --lane isaaclab2
