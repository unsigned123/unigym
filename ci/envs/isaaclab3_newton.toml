# Clean IsaacLab 3 Newton lane versions.  Measured from the installed
# distributions on the reference lane (docs/designs/isaaclab3-backend.md).
# No machine paths.  The 3.0.0rc1 line is pinned until a 3.0 GA lane exists.
# The extension distributions report version 0.0.0; that is their published
# value, not a fallback.  isaaclab_physx is recorded because the default
# camera renderer (IsaacRtxRendererCfg) comes from it.
python = "3.12"
isaacsim = "6.1.0.0"
isaaclab = "3.0.0rc1"
isaaclab_physx = "0.0.0"
isaaclab_newton = "0.0.0"
isaaclab_tasks = "0.0.0"
isaaclab_assets = "0.0.0"
newton = "1.6.1"
mujoco = "3.12.0"
"mujoco-warp" = "3.12.0"
"warp-lang" = "1.17.0"
torch = "2.11.0+cu130"
