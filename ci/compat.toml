# Supported test lanes and the environments that provision them.
# One lane owns one environment; selectors are the test-to-lane contract.
version = 1

[environments.base]
provision = "uv"
extras = ["dev"]

[environments.base-py312]
provision = "uv"
extras = ["dev"]
python = "3.12"

[environments.daemon]
provision = "uv"
extras = ["dev", "daemon"]

[environments.mjwarp]
provision = "uv"
extras = ["dev", "warp"]

[environments.isaaclab2]
provision = "conda"
env_var = "UNIGYM_ISAACLAB2_ENV"
manifest = "ci/envs/isaaclab2.toml"
strict = true

[lanes.d0]
environment = "base"
selectors = [
  "tests/smoke",
  "tests/unit",
  "tests/contract",
  "tests/conformance",
  "tests/meta",
]

# Versioned nightly lane: reuses d0's test ownership in a Python 3.12 environment.
[lanes.d0-py312]
environment = "base-py312"
variant_of = "d0"
selectors = [
  "tests/smoke",
  "tests/unit",
  "tests/contract",
  "tests/conformance",
  "tests/meta",
]

[lanes.integration]
environment = "base"
selectors = [
  "tests/integration/test_cli_smoke.py",
  "tests/integration/test_daemon_cli.py",
]

[lanes.daemon]
environment = "daemon"
selectors = ["tests/integration/test_daemon_lifecycle.py"]

[lanes.mujoco]
environment = "base"
selectors = ["tests/backends/mujoco"]

# Versioned nightly lane: reuses mujoco's test ownership in a Python 3.12
# environment.
[lanes.mujoco-py312]
environment = "base-py312"
variant_of = "mujoco"
selectors = ["tests/backends/mujoco"]

[lanes.mjwarp]
environment = "mjwarp"
selectors = ["tests/backends/mjwarp"]

[lanes.isaaclab2]
environment = "isaaclab2"
selectors = ["tests/backends/isaaclab2"]

# Lanes the nightly workflow runs. C1 (oldest MuJoCo/NumPy pair) is deferred
# until an empirically verified combination exists.
[nightly]
lanes = ["d0-py312", "mujoco-py312", "mjwarp", "isaaclab2"]
