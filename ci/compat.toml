# Supported test lanes and the environments that provision them.
# One lane owns one environment; selectors are the test-to-lane contract.
version = 1

[environments.base]
provision = "uv"
extras = ["dev"]

[environments.base-py312]
provision = "uv"
extras = ["dev"]
python = "3.12"

# Clean C1 environment: a separate clean venv provisioned from the pinned
# manifest.  ``no_sync`` keeps ``uv run`` from resyncing it to the 4.0 lock.
[environments.base-c1]
provision = "uv"
python = "3.11"
no_sync = true
manifest = "ci/envs/c1.toml"

[environments.daemon]
provision = "uv"
extras = ["dev", "daemon"]

[environments.mjwarp]
provision = "uv"
extras = ["dev", "warp"]

[environments.isaaclab2]
provision = "conda"
env_var = "UNIGYM_ISAACLAB2_ENV"
manifest = "ci/envs/isaaclab2.toml"
strict = true

[lanes.d0]
environment = "base"
selectors = [
  "tests/smoke",
  "tests/unit",
  "tests/contract",
  "tests/conformance",
  "tests/meta",
]

# Versioned nightly lane: reuses d0's test ownership in a Python 3.12 environment.
[lanes.d0-py312]
environment = "base-py312"
variant_of = "d0"
selectors = [
  "tests/smoke",
  "tests/unit",
  "tests/contract",
  "tests/conformance",
  "tests/meta",
]

# C1 nightly lane: reuses d0's test ownership in the pinned C1 environment.
[lanes.d0-c1]
environment = "base-c1"
variant_of = "d0"
selectors = [
  "tests/smoke",
  "tests/unit",
  "tests/contract",
  "tests/conformance",
  "tests/meta",
]

[lanes.integration]
environment = "base"
selectors = [
  "tests/integration/test_cli_smoke.py",
  "tests/integration/test_daemon_cli.py",
  "tests/integration/test_pack_cli_provenance.py",
]

[lanes.daemon]
environment = "daemon"
selectors = ["tests/integration/test_daemon_lifecycle.py"]

[lanes.mujoco]
environment = "base"
selectors = ["tests/backends/mujoco"]

# Versioned nightly lane: reuses mujoco's test ownership in a Python 3.12
# environment.
[lanes.mujoco-py312]
environment = "base-py312"
variant_of = "mujoco"
selectors = ["tests/backends/mujoco"]

# C1 nightly lane: reuses mujoco's test ownership in the pinned C1 environment.
[lanes.mujoco-c1]
environment = "base-c1"
variant_of = "mujoco"
selectors = ["tests/backends/mujoco"]

[lanes.mjwarp]
environment = "mjwarp"
selectors = ["tests/backends/mjwarp"]

[lanes.isaaclab2]
environment = "isaaclab2"
selectors = ["tests/backends/isaaclab2"]
pytest_args = ["--strict-test-packs"]

# Lanes the nightly workflow runs.  C1 is the empirically verified oldest
# MuJoCo/NumPy pair (Python 3.11 / MuJoCo 3.1.1 / NumPy 1.26.4); it is nightly
# only and is not a PR gate.
[nightly]
lanes = ["d0-py312", "mujoco-py312", "d0-c1", "mujoco-c1", "mjwarp", "isaaclab2"]
